services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server has no arm64 image; on Apple Silicon this runs emulated under Rosetta.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?SA_PASSWORD must be set, see .env.example}
    ports:
      - "1433:1433"
    volumes:
      - crn-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/API/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Development by default so this local/demo stack serves Swagger UI at /swagger. Override to
      # Production in your .env to test production behavior (no Swagger, HSTS/HTTPS-redirect logic
      # still skipped via DOTNET_RUNNING_IN_CONTAINER — see CLAUDE.md).
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=CRN;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__Issuer: CRN.API
      Jwt__Audience: CRN.Client
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set (>= 32 chars), see .env.example}
      Jwt__AccessTokenMinutes: "15"
      Jwt__RefreshTokenDays: "7"
      Seed__Admin__UserName: ${SEED_ADMIN_USERNAME:-admin}
      Seed__Admin__Email: ${SEED_ADMIN_EMAIL:-admin@localhost}
      Seed__Admin__Password: ${SEED_ADMIN_PASSWORD:-}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-[]}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  crn-sql-data:
